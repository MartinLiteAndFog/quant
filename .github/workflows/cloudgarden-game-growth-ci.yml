name: Cloudgarden G1 mechanistic market growth

on:
  pull_request:
    paths:
      - "apps/cloudgarden/**"
      - ".github/workflows/cloudgarden-game-growth-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Base Cloudgarden PR lockfile was not fixed on this isolated game branch.
      - name: Install game dependencies without modifying the lockfile
        run: npm install --prefix apps/cloudgarden --no-package-lock
      - name: Run game and historical replay fixture tests
        run: npm test --prefix apps/cloudgarden
      # Historical baseline TS config includes Node test files; this is a
      # temporary CI-only dependency until Agent A's source CI fix lands.
      - name: Supply Node 22 test types without editing any app manifests
        run: npm install --prefix apps/cloudgarden --no-save --no-package-lock @types/node@22
      - name: Typecheck and build playable game
        run: npm run build --prefix apps/cloudgarden
