name: Ecosystem Renko 5m IMBA Research Signal Audit

on:
  pull_request:
    paths:
      - 'src/quant/ecosystem/market_data/renko_imba_audit.py'
      - 'scripts/ecosystem_renko_imba_audit.py'
      - 'tests/ecosystem/test_renko_imba_audit.py'
      - '.github/workflows/ecosystem-renko-imba-audit.yml'
  workflow_dispatch:

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing strategy module research dependencies
        run: python -m pip install 'pandas>=2.0' 'numpy>=1.24'
      - name: Legacy Renko/IMBA 5m causal signal and reference diagnostics
        run: python -m unittest discover -s tests/ecosystem -p test_renko_imba_audit.py -v
