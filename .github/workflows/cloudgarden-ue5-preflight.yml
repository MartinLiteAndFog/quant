name: Cloudgarden UE5 preflight (no Unreal editor)
on:
  pull_request:
    paths:
      - 'apps/cloudgarden-ue5/**'
      - 'docs/plans/2026-11-02-cloudgarden-unreal5-agent-f.md'
      - 'docs/plans/2026-11-02-cloudgarden-ue5-gene-physics-bridge.md'
      - 'docs/plans/2026-11-02-cloudgarden-ue5-multi-parameter-tiles.md'
      - 'docs/plans/2026-11-02-cloudgarden-ue5-tile-experiments-and-capital.md'
      - 'docs/plans/2026-11-02-cloudgarden-ue5-research-journal-and-mode-preview.md'
      - '.github/workflows/cloudgarden-ue5-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check non-empirical scene fixture and safe two-gene tile assignment
        run: python3 apps/cloudgarden-ue5/scripts/validate_fixture.py
      - name: Verify gene bindings and ballistic seed feedback with tamper cases
        run: python3 apps/cloudgarden-ue5/scripts/validate_gene_physics.py
      - name: Validate generated machine-readable Unreal bindings
        run: |
          python3 apps/cloudgarden-ue5/scripts/project_unreal_parameters.py > /tmp/ue_properties.json
          python3 -c 'import json; r=json.load(open("/tmp/ue_properties.json")); assert r["mode"] == "dry_run_no_editor" and len(r["assignments"]) == 13'
      - name: Verify seed landing creates forward-only two-gene research proposals
        run: |
          python3 apps/cloudgarden-ue5/scripts/propose_offspring_genes.py > /tmp/offspring_proposals.json
          python3 -c 'import json; r=json.load(open("/tmp/offspring_proposals.json")); assert r["policy"].startswith("never_write_back") and len(r["proposals"]) == 3'
      - name: Create deterministic one-to-many tile projection JSON
        run: |
          python3 apps/cloudgarden-ue5/scripts/project_parameter_tiles.py > /tmp/ue-tiles.json
          python3 -c 'import json; x=json.load(open("/tmp/ue-tiles.json")); assert x["canonicalPlantCount"] == 4 and x["renderInstanceCount"] == 6'
      - name: Test per-tile gene membership, identity, and physics isolation
        run: python3 -m unittest discover -s apps/cloudgarden-ue5/scripts -p 'test_parameter_tiles.py' -v
      - name: Plan independent tile seed research and paper capital mode requests
        run: |
          python3 apps/cloudgarden-ue5/scripts/plan_tile_experiments.py > /tmp/tile_experiments.json
          python3 -c 'import json; x=json.load(open("/tmp/tile_experiments.json")); assert x["totalIndependentReleases"] == 6 and x["totalSimulatedSeedOutcomes"] == 16 and x["requestedPaperBudgetTotalUsdt"] == "60.00" and not x["liveAccountOrOrderWrites"]'
      - name: Test independent tile seed and off-paper-live mode gates
        run: python3 -m unittest discover -s apps/cloudgarden-ue5/scripts -p 'test_tile_experiments.py' -v
      - name: Build hash-chained research journal and compare with source plan
        run: |
          python3 apps/cloudgarden-ue5/scripts/tile_research_journal.py > /tmp/tile_research_journal.json
          python3 -c 'import json; j=json.load(open("/tmp/tile_research_journal.json")); assert j["eventCount"] == 42 and j["authority"] == "synthetic_untrusted_reference_not_canonical"'
      - name: Preview tile mode change without capital or trading writes
        run: |
          python3 apps/cloudgarden-ue5/scripts/preview_tile_mode.py > /tmp/tile_mode_preview.json
          python3 -c 'import json; p=json.load(open("/tmp/tile_mode_preview.json")); assert p["requestedPaperPoolAfterUsdt"] == "35.00" and not p["accepted"] and not p["cashBooked"] and p["venueOrders"] == 0'
      - name: Verify causal journal, idempotency and requested-mode transition safety
        run: python3 -m unittest discover -s apps/cloudgarden-ue5/scripts -p 'test_tile_journal.py' -v
