name: Blaupunkt Family PostgreSQL Integration

on:
  pull_request:
    paths:
      - 'src/quant/execution/family_durable_ledger.py'
      - 'src/quant/sql/014_family_ledger.sql'
      - 'tests/test_family_*integration.py'
      - '.github/workflows/blaupunkt-family-db-tests.yml'
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_family_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quant_family_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quant_family_test
      FAMILY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quant_family_test
      FAMILY_ROUTER_ENABLED: '0'
      LIVE_TRADING_ENABLED: '0'
      TV_EXEC_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . httpx
      - name: Check no syntax errors
        run: python -m compileall -q src/quant/execution/family_durable_ledger.py
      - name: Run transactional Postgres tests
        run: python -m unittest discover -s tests -p 'test_family_*integration.py' -v
