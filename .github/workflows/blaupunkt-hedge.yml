name: Blaupunkt hedge tests

on:
  pull_request:
    paths:
      - "src/quant/execution/blaupunkt_hedge.py"
      - "src/quant/execution/bot_webhook.py"
      - "tests/test_blaupunkt_hedge.py"
      - ".github/workflows/blaupunkt-hedge.yml"
  workflow_dispatch:

jobs:
  hedge-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_blaupunkt_hedge.py
