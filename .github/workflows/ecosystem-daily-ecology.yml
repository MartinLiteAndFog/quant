name: Ecosystem Daily Plant Ecology

on:
  pull_request:
    paths:
      - 'src/quant/ecosystem/ecology/**'
      - 'tests/ecosystem/test_ecology.py'
      - '.github/workflows/ecosystem-daily-ecology.yml'
  workflow_dispatch:

jobs:
  physiology:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-venue daily plant ecology tests
        run: python -m unittest discover -s tests/ecosystem -p test_ecology.py -v
