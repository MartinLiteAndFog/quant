name: Fleet Evolution Meadow

on:
  pull_request:
    paths:
      - 'apps/fleet-desktop/src/**'
      - 'apps/fleet-desktop/package.json'
      - 'apps/fleet-desktop/package-lock.json'
      - '.github/workflows/fleet-evolution-meadow.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/fleet-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/fleet-desktop/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test gene schema, five bee crosses and progressive plant growth
        run: node --experimental-strip-types tests/geneLibrary.smoke.mjs
      - name: Typecheck and bundle Fleet desktop frontend
        run: npm run build
