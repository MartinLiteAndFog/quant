name: CloudGarden gameplay menu checks
on:
  push:
    branches: [codex/cloudgarden-gameplay-shell-20261103]
  pull_request:
    paths:
      - 'apps/cloudgarden/**'
      - '.github/workflows/cloudgarden-gameplay-check.yml'
  workflow_dispatch:

jobs:
  reference-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cloudgarden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cloudgarden/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript and Vite build
        run: npm run build
