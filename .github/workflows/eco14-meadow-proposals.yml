name: ECO-14 Read-only New Two-Gene Meadow Proposals

on:
  pull_request:
    paths:
      - 'apps/fleet-desktop/src/lib/meadowCatalogProposals.ts'
      - 'apps/fleet-desktop/tests/meadowCatalogProposals.smoke.mjs'
      - '.github/workflows/eco14-meadow-proposals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  category-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/fleet-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/fleet-desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Registered two-gene category coverage and capital neutrality
        run: node --experimental-strip-types tests/meadowCatalogProposals.smoke.mjs
      - name: Existing multi-region tile world invariants
        run: node --experimental-strip-types tests/tileWorld.smoke.mjs
      - name: Typecheck and bundle without broker state changes
        run: npm run build
