name: Ecosystem Daily Paper Clock

on:
  pull_request:
    paths:
      - 'src/quant/ecosystem/sim_clock/**'
      - 'tests/ecosystem/test_sim_clock.py'
      - '.github/workflows/ecosystem-daily-clock.yml'
  workflow_dispatch:

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deterministic UTC paper-only clock tests
        run: python -m unittest discover -s tests/ecosystem -p test_sim_clock.py -v
