name: Ecosystem Predation Paper Safety
on:
  pull_request:
    paths:
      - 'src/quant/ecosystem/lifecycle/**'
      - 'tests/ecosystem/test_predation.py'
      - '.github/workflows/ecosystem-predation.yml'
  workflow_dispatch:
jobs:
  predation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Predation and confirmed-flat archive safety
        run: python -m unittest discover -s tests/ecosystem -p test_predation.py -v
